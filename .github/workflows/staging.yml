# Environnement de test partagé : Worker `bobine-staging`
# (https://bobine-staging.creusatbenjamin.workers.dev), déployé depuis la
# branche choisie au lancement (main par défaut) et branché sur une copie
# anonymisée de la base de prod — voir scripts/staging.ts.
#
# Lancement manuel uniquement (onglet Actions → "Staging" → Run workflow) :
# la copie de la base écrase tout ce que les testeurs ont fait depuis la
# copie précédente, ce n'est donc jamais automatique.
name: Staging

on:
  workflow_dispatch:
    inputs:
      copy_db:
        description: "Recopier (et anonymiser) la base de prod — écrase les données de test actuelles"
        type: boolean
        default: true

# Jamais deux copies/déploiements du staging en même temps.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Copy DB & deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://bobine-staging.creusatbenjamin.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Copy anonymized prod database
        if: inputs.copy_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/staging.ts copy-db

      - name: Generate staging config & apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/staging.ts config

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.generated.jsonc
