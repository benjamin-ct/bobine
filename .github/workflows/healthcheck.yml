# Disponibilité (voir proposition d'observabilité, ticket Trello "Mettre en
# place des metrics d'erreur") : ping périodique de la prod, alerte Discord
# immédiate en cas d'échec, message de rétablissement au retour au vert.
#
# L'état précédent (up/down) est mémorisé via actions/cache (clé unique par
# run, restaurée depuis le run précédent via `restore-keys`) plutôt que via
# une variable de repo : ça évite d'alerter à chaque exécution tant que le
# site reste down, en n'alertant que sur les TRANSITIONS d'état.
#
# Pour tester l'alerte sans attendre une vraie panne : Actions → Healthcheck
# → "Run workflow" → cocher `simulate_failure`. Le run suivant (planifié ou
# manuel sans la case cochée) enverra alors le message de rétablissement,
# ce qui permet de vérifier les deux messages Discord en une fois.
# TEMPORAIRE — test pre-merge (ticket Trello "Mettre en place des metrics
# d'erreur") : déclenchement sur push le temps de vérifier les deux messages
# Discord (alerte + rétablissement) avant que la PR ne soit mergée, puisque
# workflow_dispatch n'est utilisable qu'une fois le fichier présent sur
# main. À retirer avant le merge (voir dernier commit de la PR).
name: Healthcheck

on:
  push:
    branches:
      - docs/proposition-monitoring-erreurs
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Forcer un statut 'down' pour tester l'alerte Discord, sans dépendre d'une vraie panne"
        type: boolean
        default: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        id: ping
        run: |
          # TEMPORAIRE : force "up" pour ce test pre-merge (voir bandeau ci-dessus).
          echo "status=up" >> "$GITHUB_OUTPUT"

      - name: Restore previous status
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .health-status
          key: health-status-${{ github.run_id }}
          restore-keys: |
            health-status-

      - name: Read previous status
        id: previous
        run: |
          if [ -f .health-status ]; then
            echo "status=$(cat .health-status)" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Discord on failure
        if: steps.ping.outputs.status == 'down' && steps.previous.outputs.status == 'up'
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"content": "🚨 Bobine (prod) ne répond plus (échec de /api/health). https://bobine.creusatbenjamin.workers.dev"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord on recovery
        if: steps.ping.outputs.status == 'up' && steps.previous.outputs.status == 'down'
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"content": "✅ Bobine (prod) est de nouveau disponible."}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Write current status
        run: echo "${{ steps.ping.outputs.status }}" > .health-status

      - name: Save status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-status
          key: health-status-${{ github.run_id }}
