# Suppression de l'environnement de test (staging), abandonné : supprime le
# Worker `bobine-staging` et sa base D1 `bobine-staging` (copie de la base de
# prod) sur Cloudflare.
#
# Se lance tout seul une fois, au merge sur main du commit qui ajoute ce
# fichier (filtre `paths`), et peut être relancé à la main (Actions →
# "Staging teardown" → Run workflow). Idempotent : une ressource déjà
# supprimée est simplement ignorée. Une fois passé au vert, ce fichier peut
# être supprimé.
#
# Appels directs à l'API Cloudflare plutôt que `wrangler delete` : sans
# config, `wrangler delete` lit wrangler.jsonc et viserait le Worker de prod.
name: Staging teardown

on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-teardown.yml]
  workflow_dispatch:

jobs:
  teardown-staging:
    name: Delete staging Worker & D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Noms en dur : jamais la prod (Worker `bobine`, base `bobine-notifications`).
      STAGING_WORKER_NAME: bobine-staging
      STAGING_DATABASE_NAME: bobine-staging
    steps:
      - name: Delete staging Worker
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          # force=true : le Worker porte des Durable Objects (hérités de la config de prod).
          status=$(curl -sS -o response.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$STAGING_WORKER_NAME?force=true")
          cat response.json; echo
          if [ "$status" = "404" ]; then
            echo "Worker '$STAGING_WORKER_NAME' déjà absent."
          elif [ "$status" != "200" ]; then
            echo "::error::Suppression du Worker '$STAGING_WORKER_NAME' impossible (HTTP $status)."
            exit 1
          else
            echo "Worker '$STAGING_WORKER_NAME' supprimé."
          fi

      - name: Delete staging D1 database
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          # Le filtre `name` de l'API est une recherche partielle : on ne garde
          # que la base dont le nom correspond exactement.
          uuids=$(curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/d1/database?name=$STAGING_DATABASE_NAME&per_page=100" \
            | jq -r --arg name "$STAGING_DATABASE_NAME" '.result[] | select(.name == $name) | .uuid')
          if [ -z "$uuids" ]; then
            echo "Base '$STAGING_DATABASE_NAME' déjà absente."
            exit 0
          fi
          for uuid in $uuids; do
            curl -sS --fail-with-body -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/d1/database/$uuid"
            echo
            echo "Base '$STAGING_DATABASE_NAME' ($uuid) supprimée."
          done
