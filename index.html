<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      media="(prefers-color-scheme: dark)"
      href="/apple-touch-icon-dark.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#130e0a" />
    <!-- Pas de apple-mobile-web-app-status-bar-style="black-translucent" :
         avec viewport-fit=cover, il faisait dessiner la page sous la barre de
         statut de la PWA installée iOS, et depuis iOS 26 le système recouvre
         cette zone d'un flou Liquid Glass (scroll edge effect) qui déborde
         d'environ 40pt sur le header — bande floue en haut de toute l'appli,
         sans aucun moyen CSS de la désactiver. Sans cette meta, la page démarre
         sous une barre de statut opaque, peinte avec theme-color (résolu avant
         le premier paint par theme-init.js) ; env(safe-area-inset-top) y vaut
         0. Limite : un changement de thème en cours de session ne repeint la
         barre de statut qu'au relancement de l'appli installée. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Fichier externe (pas de <script> inline) : la CSP du Worker n'inclut
         pas 'unsafe-inline' sur script-src, voir public/theme-init.js pour
         le détail. Bloquant (pas de defer/async/module) pour s'exécuter
         avant le premier paint du loader ci-dessous. -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Découvre où regarder tes films et séries en streaming, tire un titre au hasard, et suis ce que tu as déjà vu."
    />
    <title>Seancy — Films &amp; séries à regarder</title>
    <style>
      /* Loader affiché avant que React (et global.css/variables.css) ne soit
         chargé : couleurs dupliquées en dur ici (pas d'accès aux custom
         properties tant que ce fichier n'est pas chargé), calées sur le
         thème sombre par défaut de variables.css. Le thème réel (choix
         explicite stocké ou repli système) est résolu par theme-init.js,
         chargé ci-dessus *avant* ce bloc, via l'attribut data-theme sur <html> —
         seule source de vérité, plus fiable qu'une media query dupliquée ici
         qui ignorerait un choix explicite différent du système (flash au
         montage de React). Retiré par main.tsx une fois React monté. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #130e0a;
        transition: opacity 0.2s ease;
      }

      #app-loader__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid oklch(0.38 0.02 66);
        border-top-color: #c1443f;
        animation: app-loader-spin 0.8s linear infinite;
      }

      html[data-theme="light"] #app-loader {
        background-color: #fbf9f5;
      }

      html[data-theme="light"] #app-loader__spinner {
        border-color: oklch(0.9 0.014 80);
        border-top-color: #a53a35;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader__spinner {
          animation: none;
        }
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #app-loader.app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader" role="status" aria-label="Chargement de Seancy">
      <div id="app-loader__spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
