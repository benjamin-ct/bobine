name: trello-claude-pipeline

services:
  webhook-listener:
    build: ./listener
    container_name: trello-claude-listener
    ports:
      - "29000:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
    restart: unless-stopped

  bobine-repo:
    build: ./bobine-repo
    container_name: bobine-repo
    command: sleep infinity
    user: claudeuser
    volumes:
      - ../../:/workspace
      - ./ssh-keys:/home/claudeuser/.ssh
      - claude-config:/home/claudeuser/.claude:rw
    working_dir: /workspace
    environment:
      # Ne JAMAIS définir ANTHROPIC_API_KEY ici : sa seule présence
      # bascule la facturation en mode API à l'usage, au lieu de
      # consommer l'abonnement Pro/Max via le token OAuth ci-dessous.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - GH_TOKEN=${GH_TOKEN}
    restart: unless-stopped

volumes:
  claude-config:
