name: trello-claude-pipeline

services:
  webhook-listener:
    build: ./listener
    container_name: trello-claude-listener
    ports:
      - "29000:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_SENTRY_WEBHOOK_URL=${DISCORD_SENTRY_WEBHOOK_URL}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - SENTRY_WEBHOOK_SECRET=${SENTRY_WEBHOOK_SECRET}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-medium}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
    restart: unless-stopped

  # Tunnel Cloudflare vers webhook-listener (profil optionnel, voir README
  # « Exposition externe via Cloudflare Tunnel ») : expose /trello-webhook, /sentry-webhook et
  # /dashboard sans redirection de port sur le routeur/NAS. Non démarré par `bobine-rebuild all` ;
  # utiliser `bobine-rebuild tunnel` une fois CLOUDFLARE_TUNNEL_TOKEN renseigné.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bobine-cloudflared
    command: tunnel run
    profiles:
      - tunnel
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  bobine-repo:
    build: ./bobine-repo
    container_name: bobine-repo
    command: sleep infinity
    user: claudeuser
    # Chromium (bobine-screenshot) plante avec les 64 Mo de /dev/shm par défaut.
    shm_size: "1gb"
    volumes:
      # Checkout du serveur (celui que met à jour bobine-pull) : Claude n'y travaille jamais,
      # il reste sur main.
      - ../../:/srv/bobine
      # Clone de travail dédié de Claude (créé au premier lancement de bobine-claude-run).
      # Monté sur /workspace pour conserver la mémoire Claude liée à ce chemin.
      - claude-workspace:/workspace
      - ./ssh-keys:/home/claudeuser/.ssh
      - claude-config:/home/claudeuser/.claude:rw
    working_dir: /workspace
    environment:
      # Ne JAMAIS définir ANTHROPIC_API_KEY ici : sa seule présence
      # bascule la facturation en mode API à l'usage, au lieu de
      # consommer l'abonnement Pro/Max via le token OAuth ci-dessous.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - GH_TOKEN=${GH_TOKEN}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG}
      - SENTRY_PROJECT_SLUG=${SENTRY_PROJECT_SLUG}
      # Jeton de service Cloudflare Access : captures des previews de PR
      # (voir README, « Vérification visuelle »). Optionnels.
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      # Clé TMDB pour `wrangler dev` en local (sinon les pages restent vides). Optionnelle.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-medium}
    restart: unless-stopped

volumes:
  claude-config:
  claude-workspace:
